<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kritiGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Squircle matching rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-800 -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#kritiGrad)" filter="url(#shadow)" />
  <!-- Centered Bold Monogram K -->
  <text x="64" y="93" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="82" text-anchor="middle" fill="#ffffff" letter-spacing="0.05em">K</text>
</svg>
